[package]
name = "eax-restore"
version = "0.1.0"
edition = "2021"
description = "TUI for restoring EAX/DirectSound3D audio in classic Windows games on Linux"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
nucleo-matcher = "0.3"
regex = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "=9.0.0", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dependencies run optimised even in debug builds: unoptimised, the regex
# crate takes minutes to search a modern game's binaries.
[profile.dev.package."*"]
opt-level = 3
