<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Profile Editor</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="top">
  <div class="brand"><span class="logo">EAX</span> Game profiles</div>
  <span class="sp"></span>
  <span id="aistate" class="chip-s"></span>
  <button id="cleanupbtn" class="btn ghost" data-tip="Remove what the script installed, or delete a game's Wine prefix, so you can test from scratch">Clean up…</button>
  <button id="jsontoggle" class="btn ghost" data-tip="Show or hide the live JSON and the list of problems">{ } JSON</button>
  <button id="rebuild" class="btn ghost" data-tip="Regenerate game-database.json from the per-game files">Rebuild database</button>
</header>
<div id="layout">
  <aside id="side">
    <input id="filter" class="search" placeholder="Search games…" autocomplete="off">
    <div class="side-actions">
      <button id="addinstalled" class="btn primary wide" data-tip="Add a game: pick one installed in Steam or Heroic that has no profile yet, or add one by name">+ Add game</button>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="empty" class="empty">
      <div class="empty-art">🎮</div>
      <h2>Pick a game to edit</h2>
      <p>Choose one from the list, or add a game you have installed. Everything is edited with forms; the JSON file is written for you.</p>
    </div>
    <div id="game" hidden>
      <div id="ghead"></div>
      <nav id="snav" aria-label="Sections"></nav>
      <div id="pane"></div>
    </div>
  </main>
  <aside id="rail">
    <section><h3>Problems</h3><ul id="errors"></ul></section>
    <section><h3>JSON preview</h3><pre id="preview"></pre></section>
  </aside>
</div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>
<script>if(location.search.includes("wait"))document.write('<img src="/api/_sleep" hidden>')</script>
<script src="/app.js"></script></body></html>
