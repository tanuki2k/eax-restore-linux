<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Profile Editor</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="top">
  <div class="brand"><span class="logo">EAX</span> Game profiles</div>
  <span id="version" class="chip-s" hidden data-tip="Build number: how many commits have changed the editor. The branch and commit it's running from follow."></span>
  <span class="sp"></span>
  <button id="jsontoggle" class="btn ghost" data-tip="Show or hide the panel on the right that lists this profile's problems and shows its JSON file.">{ } JSON</button>
  <span id="aistate" class="chip-s" role="button" tabindex="0"></span>
  <button id="quitbtn" class="btn danger" data-tip="Stop the editor. Use this if you opened it from the app menu, where there's no terminal to close.">Quit</button>
</header>
<div id="updatebar" class="updatebar" hidden></div>
<div id="layout">
  <aside id="side">
    <input id="filter" class="search" placeholder="Search games…" autocomplete="off">
    <div class="side-actions">
      <button id="addinstalled" class="btn primary wide" data-tip="Add a game that's installed in Steam or Heroic but has no profile yet, or add one by typing its name.">+ Add game</button>
      <button id="cleanupbtn" class="btn wide" data-tip="Uninstall what this script put in a game, or delete its Wine prefix, to test again from a clean start.">Manage installs…</button>
    </div>
    <div id="list"></div>
    <div class="side-foot"><button id="rebuild" class="btn wide" data-tip="Rebuild game-database.json from the game files, so it matches what you've saved.">Rebuild database</button></div>
  </aside>
  <main id="main">
    <div id="empty" class="empty">
      <div class="empty-art">🎮</div>
      <h2>Pick a game to edit</h2>
      <p>Choose one from the list, or add a game you have installed. Everything is edited with forms; the JSON file is written for you.</p>
    </div>
    <div id="game" hidden>
      <div id="ghead"></div>
      <nav id="snav" aria-label="Sections"></nav>
      <div id="pane"></div>
    </div>
  </main>
  <aside id="rail">
    <section><h3>Problems</h3><ul id="errors"></ul></section>
    <section><h3>JSON preview</h3><pre id="preview"></pre></section>
  </aside>
</div>
<div id="tip" role="tooltip" popover="manual"></div>
<div id="toast" role="status" popover="manual"></div>
<script>if(location.search.includes("wait"))document.write('<img src="/api/_sleep" hidden>')</script>
<script src="/app.js"></script></body></html>
