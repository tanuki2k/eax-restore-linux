name: Dev Build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-latest
    # A manual run from another branch would move the rolling dev tag and
    # replace the asset the dev update channel installs.
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: ./build.sh

      - name: Checksum
        run: sha256sum dist/eax-restore-linux.sh > dist/eax-restore-linux.sh.sha256

      - name: Read stamp from build
        id: stamp
        run: |
          # build.sh stamps the version itself from the branch (GITHUB_REF_NAME
          # is "dev" here); read it back out for the release title/notes.
          sed -nE 's/^SCRIPT_VERSION="([^"]+)".*/version=\1/p' dist/eax-restore-linux.sh >> "$GITHUB_OUTPUT"
          sed -nE 's/^SCRIPT_DATE="([^"]+)".*/date=\1/p'       dist/eax-restore-linux.sh >> "$GITHUB_OUTPUT"

      - name: Syntax check
        run: bash -n dist/eax-restore-linux.sh

      # The rolling dev asset is what the dev update channel installs, so a
      # build that fails its tests must not replace it.
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq unzip file python3-jsonschema

      - name: Shellcheck
        run: shellcheck --severity=error dist/eax-restore-linux.sh

      - name: Tests
        run: bats tests/unit tests/integration && (cd tools/profiler && python3 -m unittest discover -s tests)

      - name: Validate the game database
        run: jq empty game-database.json

      - name: Publish rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP_VERSION: ${{ steps.stamp.outputs.version }}
          STAMP_DATE: ${{ steps.stamp.outputs.date }}
        run: |
          title="Dev build ${STAMP_VERSION} (${STAMP_DATE})"
          notes="Automated build from the \`dev\` branch. **Not a stable release.** The startup banner reads \`v${STAMP_VERSION}  (${STAMP_DATE})\`. Stable users: use the Latest release instead."
          if gh release view dev >/dev/null 2>&1; then
            git tag -f dev
            git push -f origin refs/tags/dev
            gh release edit dev --prerelease --title "$title" --notes "$notes"
            gh release upload dev dist/eax-restore-linux.sh dist/eax-restore-linux.sh.sha256 --clobber
          else
            gh release create dev --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" \
              dist/eax-restore-linux.sh dist/eax-restore-linux.sh.sha256
          fi

      - name: Assert stable Latest release did not move
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name)
          echo "Latest release is: $latest"
          [ "$latest" != "dev" ] || { echo "::error::dev became the Latest release"; exit 1; }

  # The TUI binary goes on the same rolling prerelease once the script is
  # published. It is its own job so a problem with the Rust build can't hold
  # back the script, which is what the dev update channel installs.
  dev-tui:
    needs: dev-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tui/target
          key: tui-dev-${{ runner.os }}-${{ hashFiles('tui/Cargo.lock') }}
          restore-keys: tui-dev-${{ runner.os }}-

      - name: Tests
        working-directory: tui
        run: cargo test --locked

      # A static (musl) build, so one file runs on SteamOS, Debian and Fedora
      # whatever their glibc.
      # The dev channel makes the binary fetch the dev script, not the stable one.
      - name: Build
        working-directory: tui
        env:
          EAX_RESTORE_CHANNEL: dev
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Check it is static and runs
        run: |
          bin=tui/target/x86_64-unknown-linux-musl/release/eax-restore
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "::error::The TUI binary is not statically linked"; exit 1
          fi
          # With no libraries or installs on this machine the list is empty.
          HOME="$(mktemp -d)" "$bin" game-database.json --list

      - name: Name and checksum
        run: |
          mkdir -p dist
          cp tui/target/x86_64-unknown-linux-musl/release/eax-restore dist/eax-restore-linux-tui-x86_64
          (cd dist && sha256sum eax-restore-linux-tui-x86_64 > eax-restore-linux-tui-x86_64.sha256)

      - name: Add to the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload dev dist/eax-restore-linux-tui-x86_64 dist/eax-restore-linux-tui-x86_64.sha256 --clobber
