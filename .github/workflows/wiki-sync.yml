name: Wiki sync

# docs/ is the source; the wiki is generated from it. Needs the repository's
# Wiki enabled and its first page created once in the UI, or the clone fails.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/wiki-sync.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs/ to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/. wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync docs/ from ${GITHUB_SHA::7}"
            git push
          fi
